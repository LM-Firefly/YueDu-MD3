name: Update Cronet

on:
  schedule:
  # 周一北京时间9点
    - cron: 0 1 * * 1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'LM-Firefly/YueDu-MD3' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Cronet Updates
        run: source .github/scripts/cronet.sh

      - name: Set up JDK 24
        if: ${{ env.cronet == 'ok' }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 24

      - uses: gradle/actions/setup-gradle@v6
        if: ${{ env.cronet == 'ok' }}

      # 与 verify.yml / auto-release.yml 同一处理：settings.gradle 的 aliyun 镜像在 GitHub runner 上 502
      - name: Remove Aliyun mirrors (unreliable in CI)
        if: ${{ env.cronet == 'ok' }}
        run: sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Download Cronet
        if: ${{ env.cronet == 'ok' }}
        run: |
          chmod +x gradlew
          ./gradlew app:downloadCronet

      # 版本升级可能拆分 jar 或变更 proguard cfg，构建门禁确保不产出无法打包的 PR
      - name: Verify release build with the new Cronet
        if: ${{ env.cronet == 'ok' }}
        run: ./gradlew assembleAppRelease --no-configuration-cache --no-daemon

      - name: Create Pull Request
        if: ${{ env.cronet == 'ok' }}
        uses: peter-evans/create-pull-request@v8
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ env.PR_TITLE }}
          commit-message: |
            ${{ env.PR_TITLE }}
            - ${{ env.PR_BODY }}
          body: ${{ env.PR_BODY }}
          branch: cronet
          delete-branch: true
          add-paths: |
            app/cronetlib/
            *cronet.json
            *updateLog.md
            *gradle.properties
            *cronet-proguard-rules.pro
